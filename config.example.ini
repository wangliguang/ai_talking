# AI Talking 配置文件示例
# 复制此文件为 config.ini 并填入你的配置信息

[llm]
# 大模型提供商: openai, qianwen, zhipu 等
# 注意：硅基流动平台（SiliconFlow）使用OpenAI兼容API，provider设置为openai
provider = openai

# API密钥（必需）
api_key = your_api_key_here

# API基础URL（可选，用于自定义端点或国内API）
# OpenAI: https://api.openai.com/v1
# 硅基流动: https://api.siliconflow.cn/v1
# DeepSeek: https://api.deepseek.com
base_url = https://api.siliconflow.cn/v1

# 模型名称
# OpenAI: gpt-3.5-turbo, gpt-4
# 硅基流动: deepseek-ai/DeepSeek-V3.2, qwen-plus, qwen-turbo, llama-3.1-8b-instruct 等
model = deepseek-ai/DeepSeek-V3.2

# 温度参数（0.0-1.0），控制回复的随机性
temperature = 0.7

[asr]
# 语音识别提供商: xunfei (科大讯飞)
provider = xunfei

# 讯飞开放平台API凭证
app_id = your_xunfei_app_id
api_key = your_xunfei_api_key
api_secret = your_xunfei_api_secret

# 识别语言: zh (中文), en (英文)
language = zh

[tts]
# 语音合成提供商: xunfei (科大讯飞)
provider = xunfei

# 讯飞开放平台API凭证（与ASR使用相同的凭证）
app_id = your_xunfei_app_id
api_key = your_xunfei_api_key
api_secret = your_xunfei_api_secret

# 默认音色（讯飞音色名称）
# 可选: xiaoyan (小燕-女声温柔), aisxping (小萍-女声甜美), aisjiuxu (许久-男声沉稳)
voice = xiaoyan

[audio]
# 音量（0.0-1.0）
volume = 0.8

[content]
# 是否启用内容过滤
filter_enabled = true

# 内容年龄限制
age_limit = 6

[education]
# 通识教育主题（用逗号分隔）
topics = 科学,历史,地理,自然,数学,艺术

