; PlatformIO Project Configuration File
; ESP32 AI Talking项目配置

; ESP32-S3配置（推荐）
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 串口监视器配置
monitor_speed = 115200
monitor_filters = default

; 库依赖
lib_deps = 
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^6.21.3
    earlephilhower/ESP8266Audio @ ^1.9.7
    schreibfaul1/ESP32-audioI2S @ ^1.0.0

; 编译选项
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; 上传配置
upload_speed = 921600

; ESP32-WROOM-32配置（备选）
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串口监视器配置
monitor_speed = 115200
monitor_filters = default

; 库依赖
lib_deps = 
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^6.21.3
    earlephilhower/ESP8266Audio @ ^1.9.7
    schreibfaul1/ESP32-audioI2S @ ^1.0.0

; 编译选项
build_flags = 
    -DCORE_DEBUG_LEVEL=3

; 上传配置
upload_speed = 921600

